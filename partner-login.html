<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Babil Partner Portal</title>
<meta name="description" content="Babil partner portal sign-in." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0D1117" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<style>
  :root{
    --bg:#0D1117; --elev:#161B2C; --border:#1E2640; --border-ghost:#1E264022;
    --primary:#6C63FF; --primary-muted:#A78BFA; --red:#FF5C5C; --green:#00D4AA;
    --warning:#FFB547; --text:#FFFFFF; --text2:#8A94A6; --dim:#3A4258;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 0 48px}
  .wrap{width:100%;max-width:440px;padding:0 4px}
  .brandrow{display:flex;align-items:center;justify-content:space-between;padding:0 20px;margin-bottom:6px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px}
  .brandname{background:linear-gradient(135deg,#FFB547,#FF6B35);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .logo{width:26px;height:26px}
  .eyebrow{color:var(--text2);font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase}

  .sectionHeader{padding:16px 20px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border-ghost)}
  .sectionHeader.first{border-top:0}
  .sectionTitle{color:var(--text2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}

  .body{padding:18px 20px 4px}
  h1{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:10px}
  .lead{color:var(--text2);font-size:14.5px;line-height:1.6;margin-bottom:18px}
  form{display:flex;flex-direction:column;gap:14px}
  label{font-size:11px;font-weight:600;letter-spacing:.8px;color:var(--text2);text-transform:uppercase}
  input[type=email],input[type=password]{width:100%;background:transparent;border:1px solid var(--border);border-radius:14px;
    color:var(--text);font-size:16px;padding:14px;outline:none;transition:border-color .15s}
  input[type=email]:focus,input[type=password]:focus{border-color:var(--primary)}
  input[type=email]::placeholder,input[type=password]::placeholder{color:var(--dim)}
  .field{display:flex;flex-direction:column;gap:7px}
  .link{background:none;border:none;color:var(--primary-muted);font-size:13px;font-weight:600;cursor:pointer;padding:0}
  .btn{position:relative;width:100%;background:var(--primary);color:#fff;border:none;text-align:center;
    font-size:14px;font-weight:700;padding:14px;border-radius:22px;cursor:pointer;transition:opacity .15s}
  .btn:hover{opacity:.92}
  .btn:disabled{opacity:.35;cursor:default}
  .btn .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .msg{font-size:13px;line-height:1.5}
  .msg.err{color:var(--red)}
  .hidden{display:none}

  .success{padding:18px 20px 4px;text-align:center}
  .success .iconbox{width:40px;height:40px;border-radius:20px;background:var(--elev);display:flex;align-items:center;justify-content:center;margin:4px auto 16px}
  .success .iconbox svg{width:22px;height:22px}
  .success h2{font-size:20px;font-weight:800;margin-bottom:8px}
  .success p{color:var(--text2);font-size:14px;line-height:1.6}
  .success .em{color:var(--primary-muted);font-weight:600;word-break:break-all}

  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:22px}
  .foot a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandrow">
    <div class="brand">
      <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="18" y1="10" x2="102" y2="110"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6B35"/></linearGradient></defs>
        <path d="M60,10 L102,35 L102,85 L60,110 L18,85 L18,35 Z" fill="none" stroke="url(#g)" stroke-width="6" stroke-linejoin="round"/>
        <line x1="42" y1="82" x2="42" y2="62" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
        <line x1="60" y1="82" x2="60" y2="48" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
        <line x1="78" y1="82" x2="78" y2="32" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
      </svg>
      <span class="brandname">Babil</span>
    </div>
    <span class="eyebrow">Partner Portal</span>
  </div>

  <div class="sectionHeader first"><span class="sectionTitle">Sign in</span></div>

  <div id="formView" class="body">
    <h1>Partner sign-in</h1>
    <p class="lead">Sign in with the email and password you set when you created your partner profile.</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email"
               placeholder="you@example.com" autocapitalize="off" spellcheck="false" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button id="submitBtn" class="btn" type="submit">Sign in</button>
      <div id="msg" class="msg" role="status" aria-live="polite"></div>
      <div style="text-align:center">
        <button id="forgotBtn" class="link" type="button">Forgot password?</button>
      </div>
    </form>
  </div>

  <div id="successView" class="success hidden">
    <div class="iconbox">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 12.5l4.2 4.2L19 7" stroke="#00D4AA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h2>Check your email</h2>
    <p>If <span id="sentEmail" class="em"></span> has a Babil partner account, a password reset link is on its way. Open it on this device to set a new password.</p>
  </div>

  <p class="foot"><a href="/">&larr; babilfinance.com</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SUPABASE_URL = "https://nucsizdduvpojjtvayvn.supabase.co";
  var ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51Y3NpemRkdXZwb2pqdHZheXZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTM4MDksImV4cCI6MjA5NDI4OTgwOX0.CSQLhokxnSC6E3BuXbeVil6kjg39QkI9ABF0fNgqQgg";
  var REDIRECT = "https://babilfinance.com/partner-dashboard";
  var RESET_REDIRECT = location.origin + "/reset-password";
  var EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

  var sb = window.supabase.createClient(SUPABASE_URL, ANON);

  var form = document.getElementById("loginForm");
  var input = document.getElementById("email");
  var passIn = document.getElementById("password");
  var btn = document.getElementById("submitBtn");
  var forgotBtn = document.getElementById("forgotBtn");
  var msg = document.getElementById("msg");
  var formView = document.getElementById("formView");
  var successView = document.getElementById("successView");
  var sentEmail = document.getElementById("sentEmail");

  // Already signed in? Go straight to the dashboard.
  sb.auth.getSession().then(function(res){
    if(res && res.data && res.data.session){ location.replace(REDIRECT); }
  });

  function showError(t){ msg.textContent = t; msg.classList.add("err"); }
  function clearError(){ msg.textContent = ""; msg.classList.remove("err"); }
  function setLoading(on){ btn.disabled = on; btn.innerHTML = on ? '<span class="spin"></span>Signing in…' : 'Sign in'; }
  function showSent(email){ sentEmail.textContent = email; formView.classList.add("hidden"); successView.classList.remove("hidden"); }

  input.addEventListener("input", clearError);
  passIn.addEventListener("input", clearError);

  form.addEventListener("submit", function(e){
    e.preventDefault();
    clearError();
    var email = (input.value || "").trim().toLowerCase();
    var pass = passIn.value || "";
    if(!EMAIL_RE.test(email)){ showError("Please enter a valid email address."); return; }
    if(!pass){ showError("Please enter your password."); return; }
    setLoading(true);

    sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res){
      if(res.error){ setLoading(false); showError("Wrong email or password."); return; }
      location.replace(REDIRECT);
    }).catch(function(){
      setLoading(false);
      showError("Network error. Please check your connection and try again.");
    });
  });

  // Forgot password: email a reset link (does not leak whether the
  // account exists). The link lands on /reset-password.
  forgotBtn.addEventListener("click", function(){
    clearError();
    var email = (input.value || "").trim().toLowerCase();
    if(!EMAIL_RE.test(email)){ showError("Enter your email above first, then tap Forgot password."); return; }
    forgotBtn.disabled = true;
    sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_REDIRECT }).then(function(){
      showSent(email);
    }).catch(function(){
      forgotBtn.disabled = false;
      showError("Network error. Please try again.");
    });
  });
})();
</script>
</body>
</html>
